<style>
.rar-common{--rc:#9ad7ff}.rar-rare{--rc:#4d8dff}.rar-epic{--rc:#c06bff}.rar-legend{--rc:#ffd76a}
.item-card.r{border-color:var(--rc);box-shadow:0 0 24px color-mix(in srgb,var(--rc) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--rc) 10%,transparent)}
.item-card.r:hover{box-shadow:0 0 44px var(--rc)}
.item-card.r .item-name{color:var(--rc);text-shadow:0 0 12px var(--rc)}
.item-card.r .halo{position:absolute;top:18px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 68%);opacity:.35;animation:halo 3s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.35);opacity:.6}}
.rar-tag{position:relative;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--rc);border:1px solid var(--rc);padding:2px 12px;border-radius:12px;margin-bottom:10px}
.chest{position:relative;font-size:3.7rem;margin-bottom:6px;filter:drop-shadow(0 0 16px var(--rc));animation:chestBob 2.6s ease-in-out infinite}
@keyframes chestBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg) scale(1.08)}}
.drops{font-size:.82rem;color:#bfe3f7;margin:-6px 0 14px;line-height:1.5}
.sec-sub{color:#9fc6df;margin:-18px 0 28px;letter-spacing:1px}

.modal-content{background:linear-gradient(160deg,#10294a,#060f1d 70%);border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px #38b6ff,0 0 60px rgba(56,182,255,.5),inset 0 0 50px rgba(127,216,255,.08)}
.modal-content::before{content:"❄";position:absolute;top:10px;left:18px;font-size:1.4rem;opacity:.6;animation:floatFlake 3s infinite}
.modal-title{font-size:1.7rem;font-weight:800;background:linear-gradient(90deg,#fff,#7fd8ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.cart-item-row{background:linear-gradient(90deg,#0b1f38,#102c4d);border-radius:12px;transition:.25s;animation:fadeUp .35s ease}
.cart-item-row:hover{transform:translateX(4px);box-shadow:0 0 14px var(--glow)}
.modal-input-field:focus{border-color:#cdf0ff;box-shadow:0 0 16px var(--glow)}
.paysafecard-box{background:linear-gradient(135deg,#1a0d00,#07121f);position:relative;overflow:hidden}
.paysafecard-box::after{content:"";position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);animation:sweep 2.8s infinite}
@keyframes sweep{to{left:160%}}
.clear-cart{background:transparent;border:1px solid #ff6a4d;color:#ff9d8a;padding:6px 14px;border-radius:14px;cursor:pointer;font-weight:700;margin-top:4px}
.clear-cart:hover{background:#ff6a4d;color:#fff}
.cart-summary{display:flex;justify-content:space-between;color:#9fc6df;font-size:.85rem;margin:6px 2px 10px}
.cart-icon-btn.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}

.shoot{position:fixed;z-index:1;width:130px;height:2px;background:linear-gradient(90deg,#fff,transparent);pointer-events:none;animation:shoot 1.2s ease-out forwards}
@keyframes shoot{from{opacity:1;transform:translate(0,0) rotate(25deg)}to{opacity:0;transform:translate(320px,150px) rotate(25deg)}}
.nav-btn.active{animation:pulseBox 2.4s infinite}
.logo{animation:logoGlow 3s ease-in-out infinite alternate}
@keyframes logoGlow{to{text-shadow:0 0 28px #7fd8ff,0 0 4px #fff}}
.floaty{position:fixed;top:-40px;z-index:2;pointer-events:none;animation:fall linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
#musicDock .nx{background:#12324f;border:1px solid var(--accent);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer}
#musicDock .nx:hover{background:var(--accent)}
#musicLabel{min-width:110px;text-align:left}
</style>

<script>
(function(){
/* ===== LINKURI PLATĂ (înlocuiește cu ale tale din Tebex) ===== */
["Winter Key","Frost Key","Aurora Key","Legendary Chest","Mega Winter Chest",
 "Spawner Zombie","Spawner Skeleton","Spawner Iron Golem","Spawner Blaze","Spawner Creeper"
].forEach(k=>{ if(!PAYMENT_LINKS[k]) PAYMENT_LINKS[k]="https://numele-tau.tebex.io/package/"+k.replace(/ /g,"-"); });

/* ===== CARDURI ===== */
const RAR={common:["COMMON","rar-common"],rare:["RARE","rar-rare"],epic:["EPIC","rar-epic"],legend:["LEGENDARY","rar-legend"]};
function card(n,desc,drops,price,icon,rar,ribbon,cls){
  const r=RAR[rar];
  return `<div class="item-card glass r ${r[1]}">
    ${ribbon?`<div class="ribbon">${ribbon}</div>`:""}
    <div class="halo"></div>
    <div class="${cls||'chest'}">${icon}</div>
    <div class="rar-tag">${r[0]}</div>
    <div class="item-name">${n}</div>
    <div class="item-desc">${desc}</div>
    ${drops?`<div class="drops">${drops}</div>`:""}
    <div class="item-price">${price} euro</div>
    <div class="btn-container">
      <button class="buy-btn" onclick="openCheckout('${n}',${price})">Cumpără</button>
      <button class="cart-add-btn" onclick="addToCart('${n}',${price})">+ Coș</button>
    </div></div>`;
}

/* ===== KEYS ===== */
document.querySelector('#keysSection .items-grid').innerHTML=[
 card("Winter Key","Cheia de început: loot de iarnă garantat.","❄ Resurse • Unelte • Shards mici",0.99,"🗝️","common"),
 card("Frost Key","Chest înghețat cu premii rare și blocuri speciale.","🧊 Armuri enchantate • Shards • Blocuri rare",1.99,"🔑","rare"),
 card("Aurora Key","Se deschide sub aurora boreală. Premii epice.","🌌 Spawnere • Tag-uri • Shards mari",3.49,"🧰","epic","POPULAR"),
 card("Legendary Chest","Cufărul legendar al regelui gheții.","👑 Set complet • Spawnere rare • Shards 2000+",5.99,"🎁","legend"),
 card("Mega Winter Chest","Cel mai mare cufăr din magazin.","💎 Tot ce e mai bun • Bonus exclusiv",9.99,"🏆","legend","BEST VALUE")
].join("");
document.querySelector('#keysSection .section-title').insertAdjacentHTML('afterend','<div class="sec-sub">Deschide cufere și câștigă premii de iarnă ✨</div>');

/* ===== SPAWNERE ===== */
const spG=document.querySelector('#spawnersSection .items-grid');
spG.classList.remove('single');
spG.innerHTML=[
 card("Spawner Gold","Aur constant, ideal pentru farm lung.","",1.49,"🪙","rare","","item-icon"),
 card("Spawner Zombie","Zombi infinit: carne și XP.","",0.99,"🧟","common","","item-icon"),
 card("Spawner Skeleton","Oase și săgeți pentru farm automat.","",0.99,"💀","common","","item-icon"),
 card("Spawner Iron Golem","Fier la greu, fără efort.","",1.99,"🗿","rare","","item-icon"),
 card("Spawner Blaze","Blaze rods pentru poțiuni și enchant-uri.","",2.49,"🔥","epic","POPULAR","item-icon"),
 card("Spawner Creeper","Praf de pușcă pentru războaie mari.","",2.99,"💥","epic","","item-icon")
].join("");
document.querySelector('#spawnersSection .section-title').insertAdjacentHTML('afterend','<div class="sec-sub">Alege spawner-ul care îți trebuie ⛏️</div>');

/* ===== COȘ ===== */
const _render=renderCartDetails;
renderCartDetails=function(){
  _render();
  const n=cart.reduce((s,i)=>s+i.quantity,0), box=document.getElementById('modalDetails');
  box.insertAdjacentHTML('afterbegin',`<div class="cart-summary"><span>🛒 ${n} produse</span><span>${cart.length} tipuri</span></div>`);
  box.insertAdjacentHTML('beforeend',`<div style="text-align:center"><button class="clear-cart" onclick="cart.length=0;updateCartBadge();closeCheckout();toast('🧹 Coș golit')">🗑 Golește coșul</button></div>`);
};
const _add=addToCart;
addToCart=function(n,p){
  _add(n,p);
  const b=document.querySelector('.cart-icon-btn');
  b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');
};

/* ===== EFECTE ===== */
setInterval(()=>{
  const s=document.createElement('i');s.className='shoot';
  s.style.top=Math.random()*35+'vh';s.style.left=Math.random()*60+'vw';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
},3200);
setInterval(()=>{
  const f=document.createElement('span');f.className='floaty';
  f.textContent=['❄','❅','❆','✨','⛄'][Math.floor(Math.random()*5)];
  f.style.left=Math.random()*100+'vw';f.style.fontSize=(14+Math.random()*22)+'px';
  f.style.animationDuration=(9+Math.random()*8)+'s';
  document.body.appendChild(f);setTimeout(()=>f.remove(),18000);
},1400);
document.addEventListener('mousemove',e=>{
  const c=e.target.closest&&e.target.closest('.item-card');
  document.querySelectorAll('.item-card').forEach(x=>{if(x!==c)x.style.transform='';});
  if(!c)return;
  const r=c.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
  c.style.transform=`perspective(700px) rotateY(${dx*12}deg) rotateX(${-dy*12}deg) translateY(-6px)`;
});

/* ===== MUZICĂ: 4 MELODII ===== */
const T=[
 {n:"❄️ Aurora Bells",bpm:68,ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],arp:[0,1,2,1,2,1,2,1]},
 {n:"🌌 Frozen Lake",bpm:54,ch:[[50,53,57],[46,50,53],[53,57,60],[48,52,55]],arp:[0,2,1,2,0,2,1,2]},
 {n:"🎄 Winter Waltz",bpm:92,ch:[[60,64,67],[65,69,72],[67,71,74],[60,64,67]],arp:[0,1,2,1,2,1]},
 {n:"🔔 Sleigh Night",bpm:112,ch:[[62,65,69],[58,62,65],[55,58,62],[57,61,64]],arp:[0,2,1,2]}
];
let ctx,master,timer,playing=false,cur=0,step=0,nextT=0,vol=.5;
const hz=m=>440*Math.pow(2,(m-69)/12);
function setup(){
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=vol*.6;
  const delay=ctx.createDelay();delay.delayTime.value=.4;
  const fb=ctx.createGain();fb.gain.value=.38;
  const wet=ctx.createGain();wet.gain.value=.45;
  delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(ctx.destination);
  master.connect(ctx.destination);master.connect(delay);
}
function bell(t,m,v,d){
  [[1,1],[2.76,.22],[5.4,.07]].forEach(([r,a])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=hz(m)*r;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v*a,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  });
}
function pad(t,notes,d){
  notes.forEach(m=>{
    const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='triangle';o.frequency.value=hz(m-12);
    f.type='lowpass';f.frequency.value=650;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.05,t+1.2);
    g.gain.linearRampToValueAtTime(.0001,t+d);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1);
  });
}
function sched(){
  const k=T[cur],E=60/k.bpm/2,L=k.arp.length;
  while(nextT<ctx.currentTime+.4){
    const bar=Math.floor(step/L),pos=step%L,ch=k.ch[bar%4];
    if(pos===0){pad(nextT,ch,E*L+.6);bell(nextT,ch[0]-12,.2,3);}
    bell(nextT,ch[k.arp[pos]]+12,.11,2.2);
    if(pos%2===0&&Math.random()<.4)bell(nextT,ch[Math.floor(Math.random()*3)]+24,.08,2.4);
    step++;nextT+=E;
  }
}
function ui(){
  const b=document.getElementById('musicBtn');
  b.classList.toggle('playing',playing);
  b.innerText=playing?'🔊':'🎵';
  document.getElementById('musicLabel').innerText=playing?T[cur].n:'Muzică';
}
function start(){
  if(playing)return;
  if(!ctx)setup();
  ctx.resume();nextT=ctx.currentTime+.1;
  timer=setInterval(sched,100);playing=true;ui();
}
function stop(){
  if(!playing)return;
  clearInterval(timer);if(ctx)ctx.suspend();
  playing=false;ui();
}
function next(){
  cur=(cur+1)%T.length;step=0;
  if(ctx)nextT=ctx.currentTime+.1;
  if(!playing)start();else ui();
  toast('🎶 '+T[cur].n);
}
Music.start=start;Music.stop=stop;
Music.toggle=()=>playing?stop():start();
Music.setVolume=v=>{vol=v;if(master)master.gain.value=v*.6;};
Music.next=next;

const nx=document.createElement('button');
nx.className='nx';nx.title='Melodia următoare';nx.textContent='⏭';
nx.onclick=next;
document.getElementById('musicBtn').after(nx);

/* ===== PORNIRE AUTOMATĂ LA PRIMUL CLICK / TASTĂ / ATINGERE =====
   (browserul nu permite sunet înainte de o acțiune a utilizatorului) */
const ev=['click','keydown','touchstart'];
function first(e){
  if(e.target&&e.target.closest&&e.target.closest('#musicDock'))return; // nu intra în conflict cu butoanele muzicii
  start();
  ev.forEach(x=>removeEventListener(x,first,true));
}
ev.forEach(x=>addEventListener(x,first,true));
})();
</script>
